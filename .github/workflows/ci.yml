name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libtesseract-dev \
            libx11-dev \
            tesseract-ocr-eng

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0

      - name: Install Crystal dependencies
        run: shards install

      - name: Generate sources and type-check the library
        run: bundle exec rake

      - name: Commit BGEM-generated source
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/qemu.cr; then
            git add src/qemu.cr
            git commit -m "Update generated QEMU source"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload generated library source for synchronization
        uses: actions/upload-artifact@v4
        with:
          name: generated-qemu-source
          path: src/qemu.cr
          if-no-files-found: error
          retention-days: 1

      - name: Run Crystal specs
        env:
          LAVINMQ_AMQP_UNIXSOCKET: /tmp/unused-test-amqp.sock
        run: crystal spec
